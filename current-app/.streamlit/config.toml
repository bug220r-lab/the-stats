[server]
address = "127.0.0.1"
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 25
fileWatcherType = "none"

[browser]
serverAddress = "127.0.0.1"
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#F4F4F4"
backgroundColor = "#080808"
secondaryBackgroundColor = "#141414"
textColor = "#F4F4F4"
baseFontSize = 17

